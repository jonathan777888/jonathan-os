<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144" role="img" aria-label="Eli, mascotte originale de Second Cerveau OS"><title>Eli, mascotte originale</title><defs><clipPath id="c"><rect width="144" height="144" rx="14"/></clipPath></defs><style>
.eli-pose{transform-box:fill-box;transform-origin:center 80%;animation:eli-sway 4.2s ease-in-out infinite}
.smile{animation:eli-blink 5.8s steps(1,end) infinite}
@keyframes eli-sway{0%,100%{transform:translateY(1px) rotate(-1deg)}25%{transform:translateY(-2px) rotate(1deg)}50%{transform:translateY(0px) rotate(-.5deg)}75%{transform:translateY(-2px) rotate(1.2deg)}}
@keyframes eli-blink{0%,65%,71%,100%{opacity:0}66%,70%{opacity:1}}
@media(prefers-reduced-motion:reduce){.eli-pose,.smile{animation:none}}
</style><g class="eli-pose"><image width="144" height="144" href="data:image/webp;base64," clip-path="url(#c)"/>
<image width="144" height="144" href="data:image/webp;base64," clip-path="url(#c)" class="smile" opacity="0"/>
</g>
</svg>