name: Publish Second Cerveau

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-second-cerveau.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover intact V12 once
        shell: python
        run: |
          import urllib.request
          from pathlib import Path

          base = 'https://dilated-hub-vqsd2t3.shipstatic.com'
          parts = []
          for name in ['part-00.txt','part-01.txt','part-02.txt']:
              parts.append(urllib.request.urlopen(f'{base}/{name}').read().decode('utf-8'))
          html = ''.join(parts)
          if 'Second Cerveau IA — V12' not in html:
              raise SystemExit('La V12 intacte n’a pas pu être reconstruite')
          if 'atob(' in html:
              raise SystemExit('La V12 reconstruite contient encore atob()')

          src = Path('second-cerveau/v12.html')
          src.parent.mkdir(parents=True, exist_ok=True)
          src.write_text(html, encoding='utf-8')
          out = Path('public')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')

      - name: Persist intact V12 in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add second-cerveau/v12.html
          git diff --cached --quiet || git commit -m "Store intact Second Cerveau IA V12"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
