name: Publish Second Cerveau

on:
  push:
    branches: [main]
    paths:
      - 'second-cerveau/**'
      - '.github/workflows/pages-second-cerveau.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone V12 page
        shell: python
        run: |
          import re, base64, gzip
          from pathlib import Path

          source = Path('second-cerveau/index.html').read_text(encoding='utf-8')
          match = re.search(r"const s='([^']+)'", source)
          if not match:
              raise SystemExit('Payload V12 introuvable dans second-cerveau/index.html')

          html = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          if 'Second Cerveau IA' not in html:
              raise SystemExit('Le contenu V12 récupéré est invalide')

          out = Path('public')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
