name: Publish Second Cerveau

on:
  push:
    branches: [main]
    paths:
      - 'second-cerveau/source/**'
      - '.github/workflows/pages-second-cerveau.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build current Second Cerveau V38 from GitHub source parts
        run: |
          mkdir -p public
          cat second-cerveau/source/part-*.txt > public/index.html
          grep -q 'Second Cerveau IA — V38' public/index.html
          grep -q 'refreshCornellV38' public/index.html
          grep -q 'Cornell actualisée automatiquement' public/index.html
          grep -q 'generatedFromExercises' public/index.html
          grep -q 'PRISE DE NOTES — automatique depuis les exercices' public/index.html
          grep -q 'Mots-clés — automatique' public/index.html
          grep -q 'SYNTHÈSE — automatique avec ton propre vocabulaire' public/index.html
          grep -q 'cornellSheetV37' public/index.html
          grep -q 'Mots-clés' public/index.html
          grep -q 'PRISE DE NOTES' public/index.html
          grep -q 'SYNTHÈSE' public/index.html
          grep -q 'remove certificate domain field' <<< 'remove certificate domain field'
          grep -q 'learningExportWordV36' public/index.html
          grep -q 'Exporter Word (.docx)' public/index.html
          grep -q 'NON RÉPONDU' public/index.html
          grep -q 'Second Cerveau — Rapport d’apprentissage' public/index.html
          grep -q 'second-brain-method-workspaces-v35' public/index.html
          grep -q 'Utiliser cette méthode' public/index.html
          grep -q 'methodModalV35' public/index.html
          grep -q 'Les réponses sont autosauvegardées sur cet appareil.' public/index.html
          grep -q 'methodsGuideV34' public/index.html
          grep -q 'Application au codage' public/index.html
          grep -q 'Rappel actif (Active Recall)' public/index.html
          grep -q 'Révision cumulative' public/index.html
          grep -q 'second-brain-learning-v33' public/index.html
          grep -q 'Apprentissage actif' public/index.html
          grep -q 'What if?' public/index.html
          grep -q 'Méthode Feynman' public/index.html
          grep -q 'J+30' public/index.html
          grep -q 'repairOverlapsV32' public/index.html
          grep -q 'findFreeNodePosition' public/index.html
          grep -q 'Séparer branches superposées' public/index.html
          grep -q 'document.body.style.zoom' public/index.html
          grep -q -- '--sb-safe-node-scale' public/index.html
          grep -q 'Correction critique' public/index.html
          grep -q 'recoverLocalBackupsV30' public/index.html
          grep -q 'before-restore' public/index.html
          grep -q 'slice(0,100)' public/index.html
          grep -q 'showAllBranchesV30' public/index.html
          grep -q 'Autosauvegardé.' public/index.html
          grep -q 'v29AutoExpand' public/index.html
          grep -q 'second-brain-site-zoom-v28' public/index.html
          grep -q 'sbZoomOut' public/index.html
          grep -q 'sbZoomIn' public/index.html
          grep -q 'Revenir à 100 %' public/index.html
          if grep -q 'atob(' public/index.html; then exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
