name: Publish Second Cerveau

on:
  push:
    branches: [main]
    paths:
      - 'second-cerveau/source/**'
      - '.github/workflows/pages-second-cerveau.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build current Second Cerveau V27 from GitHub source parts
        run: |
          mkdir -p public
          cat second-cerveau/source/part-*.txt > public/index.html
          grep -q 'Second Cerveau IA — V27' public/index.html
          grep -q "FAITH_DREAMS_QUESTION" public/index.html
          grep -q "IMPROVE_QUESTION" public/index.html
          grep -q "POSITIVE_QUESTION" public/index.html
          grep -q "NEGATIVE_QUESTION" public/index.html
          grep -q "atteindre mes rêves" public/index.html
          grep -q "ce que je dois améliorer" public/index.html
          grep -q "ce qui est positif" public/index.html
          grep -q "ce qui est négatif" public/index.html
          if grep -q 'atob(' public/index.html; then exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
