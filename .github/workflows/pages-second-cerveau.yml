name: Publish Second Cerveau

on:
  push:
    branches: [main]
    paths:
      - 'second-cerveau/source/**'
      - '.github/workflows/pages-second-cerveau.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Second Cerveau V48 and check compatibility
        run: |
          mkdir -p public
          cat second-cerveau/source/part-*.txt > public/index.html
          grep -q 'Second Cerveau IA — V43' public/index.html
          grep -q 'learningVerifyV43' public/index.html
          grep -q 'Vérifier mon travail' public/index.html
          grep -q 'Configurer l’accès sécurisé' public/index.html
          grep -q 'Réponse vérifiée et corrigée' public/index.html
          grep -q 'Exporter Word corrigé (.docx)' public/index.html
          grep -q 'verifiedByV43' public/index.html
          grep -q 'cornellAiModeV42' public/index.html
          grep -q 'Correction avancée avec l’IA' public/index.html
          grep -q 'Passe 2/2' public/index.html
          grep -q 'contrôle de fidélité' public/index.html
          grep -q 'aiCorrectedSummary' public/index.html
          grep -q 'le Word complet conserve' public/index.html
          grep -q 'cornellAiCorrectV40' public/index.html
          grep -q 'Corriger la synthèse avec l’IA' public/index.html
          grep -q 'cornellAutoPreviewV39' public/index.html
          grep -q 'generatorVersion' public/index.html
          grep -q 'Rempli automatiquement depuis tes exercices' public/index.html
          grep -q 'Actualiser maintenant depuis mes réponses' public/index.html
          grep -q 'refreshCornellV38' public/index.html
          # V38 raw-review labels were retired, not the underlying features.
          grep -q 'cornellControllerV48' public/index.html
          grep -q 'generatedFromExercises' public/index.html
          grep -q 'cornellReviewStatusV48' public/index.html
          grep -q 'cornellRestoreV48' public/index.html
          grep -q 'cornellWordV48' public/index.html
          grep -Fq 'if(window.SecondBrainCornellV48?.refresh())return;' public/index.html
          grep -q 'cornellSheetV37' public/index.html
          grep -q 'Mots-clés' public/index.html
          grep -q 'PRISE DE NOTES' public/index.html
          grep -q 'SYNTHÈSE' public/index.html
          grep -q 'accessCodeV48' public/index.html
          grep -q 'learningExportWordV36' public/index.html
          grep -q 'Exporter Word (.docx)' public/index.html
          grep -q 'NON RÉPONDU' public/index.html
          grep -q 'Second Cerveau — Rapport d’apprentissage' public/index.html
          grep -q 'second-brain-method-workspaces-v35' public/index.html
          grep -q 'Utiliser cette méthode' public/index.html
          grep -q 'methodModalV35' public/index.html
          grep -q 'Les réponses sont autosauvegardées sur cet appareil.' public/index.html
          grep -q 'methodsGuideV34' public/index.html
          grep -q 'Application au codage' public/index.html
          grep -q 'Rappel actif (Active Recall)' public/index.html
          grep -q 'Révision cumulative' public/index.html
          grep -q 'second-brain-learning-v33' public/index.html
          grep -q 'Apprentissage actif' public/index.html
          grep -q 'What if?' public/index.html
          grep -q 'Méthode Feynman' public/index.html
          grep -q 'J+30' public/index.html
          grep -q 'repairOverlapsV32' public/index.html
          grep -q 'findFreeNodePosition' public/index.html
          grep -q 'Séparer branches superposées' public/index.html
          grep -q 'document.body.style.zoom' public/index.html
          grep -q -- '--sb-safe-node-scale' public/index.html
          grep -q 'Correction critique' public/index.html
          grep -q 'recoverLocalBackupsV30' public/index.html
          grep -q 'before-restore' public/index.html
          grep -q 'slice(0,100)' public/index.html
          grep -q 'showAllBranchesV30' public/index.html
          grep -q 'Autosauvegardé.' public/index.html
          grep -q 'v29AutoExpand' public/index.html
          grep -q 'second-brain-site-zoom-v28' public/index.html
          grep -q 'sbZoomOut' public/index.html
          grep -q 'sbZoomIn' public/index.html
          grep -q 'Revenir à 100 %' public/index.html
          if grep -q 'atob(' public/index.html; then exit 1; fi

      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.blocks=[]; self.buffer=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='script':
                      self.active=not a.get('src') and a.get('type','') in ('','module','text/javascript')
                      self.buffer=[]
              def handle_data(self, data):
                  if self.active: self.buffer.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.active:
                      self.blocks.append(''.join(self.buffer)); self.active=False
          parser=Scripts(); parser.feed(Path('public/index.html').read_text())
          assert parser.blocks, 'No inline JavaScript found'
          for i, code in enumerate(parser.blocks):
              path=Path('/tmp')/f'second-cerveau-{i}.mjs'; path.write_text(code)
              subprocess.run(['node','--check',str(path)],check=True)
          print(f'Checked {len(parser.blocks)} inline scripts')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
