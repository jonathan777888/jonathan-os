name: Upgrade Second Cerveau V13 Infinite Map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-second-cerveau-v13.yml'
      - 'scripts/upgrade_second_cerveau_v13.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run V13 upgrade script
        run: python scripts/upgrade_second_cerveau_v13.py
      - name: Commit V13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add second-cerveau/source
          git diff --cached --quiet || git commit -m "Upgrade Second Cerveau IA to V13 infinite map"
          git push
