name: Verify full Second Cerveau backup

on:
  pull_request:
    branches: [main]
    paths:
      - 'second-cerveau/source/part-06.txt'
      - '.github/workflows/verify-full-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complete HTML JavaScript syntax and persistence coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import tempfile,subprocess,re
          base=Path('second-cerveau')
          chunks=sorted((base/'source').glob('part-*.txt'))
          assert len(chunks)>=35,'Original source is incomplete'
          full=''.join(p.read_text(encoding='utf-8') for p in chunks)
          assert full.rstrip().endswith('</body></html>'),'Site has no closing document'
          cloud=(base/'source'/'part-06.txt').read_text(encoding='utf-8')
          for marker in [
            "key.startsWith('second-brain-')",
            "key.startsWith('jonathan-racines')",
            "key.startsWith('carte-racines')",
            "key===WORKSHOP_KEY",
            "key==='spiritual-ladder-local-v1'",
            "lastSyncedKeyDigests",
            "lastLocalChangeAt",
            "archiveCurrent(",
            "commitLocal(merged,local)",
            "lastRemoteUpdatedAt",
            ".eq('updated_at',existing.updated_at)",
            "window.addEventListener('storage'",
            "client.from(TABLE).insert(",
            "window.addEventListener('online'",
            "SENSITIVE.test(key)"
          ]:
            assert marker in cloud,marker
          class Scripts(HTMLParser):
            def __init__(self):
              super().__init__();self.blocks=[];self.active=False;self.buf=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='script':
                self.active=not a.get('src') and a.get('type','') in ('','module','text/javascript')
                self.buf=[]
            def handle_data(self,data):
              if self.active:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.active:
                self.blocks.append(''.join(self.buf));self.active=False
          p=Scripts();p.feed(full)
          assert len(p.blocks)>30
          with tempfile.TemporaryDirectory() as d:
            for i,script in enumerate(p.blocks):
              f=Path(d)/(str(i)+'.js');f.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          print('Checked',len(p.blocks),'inline scripts and persistent storage coverage')
          PY

      - name: Unit-test real cloud reconcile and data loss guards
        run: |
          node <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const source=fs.readFileSync('second-cerveau/source/part-06.txt','utf8');
          const start=source.indexOf('  function digest(v){');
          const end=source.indexOf('  function snapshot(){',start);
          const endCommit=source.indexOf('  function readMeta(){',end);
          assert(start>0&&end>start&&endCommit>end);
          const helper=source.slice(start,end);
          const state={meta:{userId:'user-1',initialized:true,lastSyncedKeyDigests:{}}};
          const context={
            user:{id:'user-1'},
            readMeta:()=>state.meta,
            isSyncableKey:k=>!/(token|secret|password|api[-_]?key)/i.test(k)&&(
              k.startsWith('second-brain-')||k==='spiritual-ladder-local-v1'||k==='second-cerveau-genie-logiciel-v1'
            )
          };
          vm.createContext(context);
          vm.runInContext(helper+";globalThis.testHelpers={digest,digests,safePayload,reconcile};",context);
          const {digest,reconcile,safePayload}=context.testHelpers;
          const k='second-brain-prayer-v23-current';
          const workshop='second-cerveau-genie-logiciel-v1';
          const spiritual='spiritual-ladder-local-v1';
          const clean=(v)=>JSON.parse(JSON.stringify(v));
          // Fresh local data are kept when the remote does not yet contain the key.
          let v=clean(reconcile({[spiritual]:'my practice'},{[k]:'prayer'}));
          assert.equal(v.conflicts.length,0);
          assert.equal(v.merged[spiritual],'my practice');
          assert.equal(v.merged[k],'prayer');
          // Same value has no conflict.
          v=clean(reconcile({[k]:'a'},{[k]:'a'}));
          assert.deepEqual(v.conflicts,[]);
          // Historical unbaselined differing notes must ask before overwriting.
          v=clean(reconcile({[k]:'version mobile'},{[k]:'version ordinateur'}));
          assert.deepEqual(v.conflicts,[k]);
          // Local change with a matching known server version merges automatically.
          state.meta.lastSyncedKeyDigests={[k]:digest('ancien')};
          v=clean(reconcile({[k]:'nouveau'},{[k]:'ancien'}));
          assert.equal(v.conflicts.length,0);
          assert.equal(v.merged[k],'nouveau');
          // Remote change with matching last local version merges automatically.
          v=clean(reconcile({[k]:'ancien'},{[k]:'nouveau'}));
          assert.equal(v.conflicts.length,0);
          assert.equal(v.merged[k],'nouveau');
          // Concurrent edits on both devices must produce a conflict.
          v=clean(reconcile({[k]:'local'},{[k]:'remote'}));
          assert.deepEqual(v.conflicts,[k]);
          // User choice from this device resolves the known conflict.
          v=clean(reconcile({[k]:'local'},{[k]:'remote'},'device'));
          assert.equal(v.merged[k],'local');
          // Sensitive keys are excluded from remote payload.
          assert.deepEqual(clean(safePayload({[workshop]:'ok','second-brain-verify-token-v43':'private'})),{[workshop]:'ok'});
          console.log('Live source merge logic, incomplete cloud, conflicts and sensitive-key filtering verified.');
          JS
